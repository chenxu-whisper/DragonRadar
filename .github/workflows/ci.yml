      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/e2e/reset-realtime.spec.ts
      - run: npm run test:e2e:reset

  web_e2e_private:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_CHANNEL: chromium
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:private

  web_e2e_ai_public:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_CHANNEL: chromium
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:ai:public

  web_e2e_ai_private:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_CHANNEL: chromium
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:ai:private

  web_production_isolation:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_CHANNEL: chromium
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:production-isolation

  reset_contract_runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm run test:contract-runtime

  private_scripts:
    # Pinned: windows-latest now resolves to the windows-2025 image,
    # where tests/test_private_scripts.ps1 fails (baseline CI run on
    # 2026-10-29) while passing locally; the DACL behavior was
    # originally validated on the windows-2022 runner generation.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Verify Reset startup validation
        shell: powershell
        run: .\tests\test_reset_start_script.ps1
      - name: Diagnose Windows private ACL environment
        shell: powershell
        run: |
          . (Join-Path $PWD "scripts/private-common.ps1")
          $probe = Join-Path $PWD (".temp/acl-diag-" + [Guid]::NewGuid().ToString("N"))
          $cursor = $probe
          while ($cursor) {
            if (Test-Path -LiteralPath $cursor) {
              $item = Get-Item -LiteralPath $cursor -Force
              $reparse = [bool]($item.Attributes -band [System.IO.FileAttributes]::ReparsePoint)
              Write-Output ("::warning title=acl-ancestor::path=" + $cursor + " reparse=" + $reparse + " attrs=" + $item.Attributes)
            }
            $parent = [System.IO.Path]::GetDirectoryName($cursor)
            if ($parent -eq $cursor) { break }
            $cursor = $parent
          }
          Initialize-PrivateDirectory $probe | Out-Null
          $dacl = Get-Acl -LiteralPath $probe
          Write-Output ("::error title=acl-dacl::protected=" + $dacl.AreAccessRulesProtected + " count=" + $dacl.Access.Count + " owner=" + $dacl.Owner)
          foreach ($rule in $dacl.Access) {
            $sid = $rule.IdentityReference.Translate([System.Security.Principal.SecurityIdentifier]).Value
            Write-Output ("::error title=acl-ace::" + $sid + " rights=" + $rule.FileSystemRights + " type=" + $rule.AccessControlType)
          }
          try {
            . (Join-Path $PWD "tests/test_private_scripts.ps1")
          } catch {
            $message = ($_.Exception.Message -replace "`r?`n", " / ")
            $line = $_.InvocationInfo.ScriptLineNumber
            Write-Output ("::error title=private-script-exception::line=" + $line + " message=" + $message)
            throw
          }
      - name: Verify Windows private-file protections
        shell: powershell
        run: .\tests\test_private_scripts.ps1
