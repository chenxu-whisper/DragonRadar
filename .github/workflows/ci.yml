name: Data Foundation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_USER: dragon_test
          POSTGRES_PASSWORD: dragon-test-local-only
          POSTGRES_DB: dragon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dragon_test -d dragon_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DRAGON_TEST_DATABASE_URL: postgresql+psycopg://dragon_test:dragon-test-local-only@localhost:5432/dragon_test
      PYTHONPYCACHEPREFIX: ${{ github.workspace }}/.temp/pycache
      UV_CACHE_DIR: ${{ github.workspace }}/.temp/uv-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.8.2
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q -W error --cov=dragon_radar --cov-report=term-missing --cov-report=xml:.temp/coverage.xml
      - run: uv run python -m compileall -q src tests
      - run: uv build --out-dir .temp/dist

  reset_performance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_USER: dragon_test
          POSTGRES_PASSWORD: dragon-test-local-only
          POSTGRES_DB: dragon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dragon_test -d dragon_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DRAGON_TEST_DATABASE_URL: postgresql+psycopg://dragon_test:dragon-test-local-only@localhost:5432/dragon_test
      PYTHONPYCACHEPREFIX: ${{ github.workspace }}/.temp/pycache
      UV_CACHE_DIR: ${{ github.workspace }}/.temp/uv-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.8.2
      - run: uv sync --locked
      - run: uv run pytest -q -rs tests/performance/test_reset_queries.py
      - uses: actions/upload-artifact@v4
        with:
          name: reset-performance-evidence
          path: .temp/acceptance/reset-performance.json

  task20_acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_USER: dragon_test
          POSTGRES_PASSWORD: dragon-test-local-only
          POSTGRES_DB: dragon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dragon_test -d dragon_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DRAGON_TEST_DATABASE_URL: postgresql+psycopg://dragon_test:dragon-test-local-only@localhost:5432/dragon_test
      PLAYWRIGHT_CHANNEL: chromium
      PYTHONPYCACHEPREFIX: ${{ github.workspace }}/.temp/pycache
      UV_CACHE_DIR: ${{ github.workspace }}/.temp/uv-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install uv==0.8.2
      - run: uv sync --locked
      - run: npm ci --ignore-scripts
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Prepare Task20 private TLS gateway
        run: ./scripts/task20-private-tls.sh setup
      - run: uv run python scripts/verify_reset.py --mode full --output .temp/acceptance/reset-base.json
      - name: Tear down Task20 private TLS gateway
        if: always()
        run: ./scripts/task20-private-tls.sh teardown
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reset-task20-evidence
          path: .temp/acceptance/

  web_quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - run: npm run check:bundle
      - run: VITE_PRIVATE_REVIEW=1 npm run build

  web_e2e_legacy:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_CHANNEL: chromium
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  web_e2e_reset:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_CHANNEL: chromium
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:reset

  web_e2e_private:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_CHANNEL: chromium
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:private

  web_e2e_ai_public:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_CHANNEL: chromium
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:ai:public

  web_e2e_ai_private:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_CHANNEL: chromium
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:ai:private

  web_production_isolation:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_CHANNEL: chromium
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:production-isolation

  reset_contract_runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm run test:contract-runtime

  private_scripts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Reset startup validation
        shell: powershell
        run: .\tests\test_reset_start_script.ps1
      - name: Verify Windows private-file protections
        shell: powershell
        run: .\tests\test_private_scripts.ps1
