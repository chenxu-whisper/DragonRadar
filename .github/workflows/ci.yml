name: Data Foundation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_USER: dragon_test
          POSTGRES_PASSWORD: dragon-test-local-only
          POSTGRES_DB: dragon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dragon_test -d dragon_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DRAGON_TEST_DATABASE_URL: postgresql+psycopg://dragon_test:dragon-test-local-only@localhost:5432/dragon_test
      PYTHONPYCACHEPREFIX: ${{ github.workspace }}/.temp/pycache
      UV_CACHE_DIR: ${{ github.workspace }}/.temp/uv-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.8.2
      - run: uv sync --locked
      - run: uv run python scripts/check_prd_contracts.py
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest tests/test_reset_realtime.py -q
      - run: uv run pytest tests/test_reset_lhb.py -q
      - run: uv run pytest -q -W error --cov=dragon_radar --cov-report=term-missing --cov-report=xml:.temp/coverage.xml
      - run: uv run python -m compileall -q src tests
      - run: uv build --out-dir .temp/dist
      - name: Verify installed wheel migrations
        run: >-
          uv run python scripts/verify_release_migrations.py
          --database-url "$DRAGON_TEST_DATABASE_URL"
          --wheel .temp/dist
          --output .temp/acceptance/task21-migrations.json
          --audited-commit '${{ github.sha }}'

  task21_migration_release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPYCACHEPREFIX: ${{ github.workspace }}/.temp/pycache
      UV_CACHE_DIR: ${{ github.workspace }}/.temp/uv-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate CI-only database password
        shell: bash
        run: |
          TASK21_POSTGRES_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$TASK21_POSTGRES_PASSWORD"
          echo "TASK21_POSTGRES_PASSWORD=$TASK21_POSTGRES_PASSWORD" >> "$GITHUB_ENV"
      - name: Start named PostgreSQL 17 release container
        shell: bash
        run: |
          docker run --detach \
            --name dragon-radar-task21-migration-release \
            --label dragon-radar.task21-release=true \
            --publish 127.0.0.1::5432 \
            --env POSTGRES_USER=dragon_task21 \
            --env POSTGRES_PASSWORD="$TASK21_POSTGRES_PASSWORD" \
            --env POSTGRES_DB=dragon_task21 \
            postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
          TASK21_POSTGRES_PORT="$(
            docker port dragon-radar-task21-migration-release 5432/tcp |
            awk -F: 'NR == 1 { print $NF }'
          )"
          echo "TASK21_POSTGRES_PORT=$TASK21_POSTGRES_PORT" >> "$GITHUB_ENV"
          echo "DRAGON_TEST_DATABASE_URL=postgresql+psycopg://dragon_task21:$TASK21_POSTGRES_PASSWORD@127.0.0.1:$TASK21_POSTGRES_PORT/postgres" >> "$GITHUB_ENV"
      - name: Wait for PostgreSQL readiness
        shell: bash
        run: |
          for attempt in $(seq 1 30); do
            if docker exec dragon-radar-task21-migration-release \
              pg_isready --username dragon_task21 --dbname dragon_task21
            then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - run: python -m pip install uv==0.8.2
      - run: uv sync --locked
      - run: uv build --out-dir .temp/dist
      - name: Verify installed wheel migrations
        run: >-
          uv run python scripts/verify_release_migrations.py
          --database-url "$DRAGON_TEST_DATABASE_URL"
          --wheel .temp/dist
          --output .temp/acceptance/task21-wheel-migrations.json
          --audited-commit '${{ github.sha }}'
      - name: Run named-container backup restore drill
        run: >-
          uv run python scripts/verify_release_migrations.py
          --restore-container dragon-radar-task21-migration-release
          --database-url "$DRAGON_TEST_DATABASE_URL"
          --output .temp/acceptance/task21-migrations.json
      - name: Remove Task21 release container
        if: always()
        run: docker rm -f dragon-radar-task21-migration-release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: task21-migration-release-evidence
          path: .temp/acceptance/

  reset_performance:
    # Pinned: ubuntu-latest migrated to Ubuntu 26 on 2026-10-19; the
    # P95 <= 2.0s gate was validated on the 24.04 runner generation.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_USER: dragon_test
          POSTGRES_PASSWORD: dragon-test-local-only
          POSTGRES_DB: dragon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dragon_test -d dragon_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DRAGON_TEST_DATABASE_URL: postgresql+psycopg://dragon_test:dragon-test-local-only@localhost:5432/dragon_test
      PYTHONPYCACHEPREFIX: ${{ github.workspace }}/.temp/pycache
      UV_CACHE_DIR: ${{ github.workspace }}/.temp/uv-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.8.2
      - run: uv sync --locked
      - run: uv run pytest -q -rs tests/performance/test_reset_queries.py
      - uses: actions/upload-artifact@v4
        with:
          name: reset-performance-evidence
          path: .temp/acceptance/reset-performance.json

  task20_acceptance:
    # Pinned: ubuntu-latest migrated to Ubuntu 26 on 2026-10-19; the
    # Task 20 private-TLS drill was validated on the 24.04 generation.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_USER: dragon_test
          POSTGRES_PASSWORD: dragon-test-local-only
          POSTGRES_DB: dragon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dragon_test -d dragon_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DRAGON_TEST_DATABASE_URL: postgresql+psycopg://dragon_test:dragon-test-local-only@localhost:5432/dragon_test
      PLAYWRIGHT_CHANNEL: chromium
      PYTHONPYCACHEPREFIX: ${{ github.workspace }}/.temp/pycache
      UV_CACHE_DIR: ${{ github.workspace }}/.temp/uv-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install uv==0.8.2
      - run: uv sync --locked
      - run: npm ci --ignore-scripts
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Prepare Task20 private TLS gateway
        run: ./scripts/task20-private-tls.sh setup
      - run: uv run python scripts/verify_reset.py --mode full --output .temp/acceptance/reset-base.json
      - name: Tear down Task20 private TLS gateway
        if: always()
        run: ./scripts/task20-private-tls.sh teardown
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reset-task20-evidence
          path: .temp/acceptance/

  web_quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - run: npm test -- --run tests/unit/reset-realtime.test.ts
      - run: npm test -- --run tests/unit/reset-lhb.test.ts
      - run: npm test
      - run: npm run build
      - run: npm run check:bundle
      - run: VITE_PRIVATE_REVIEW=1 npm run build

  web_e2e_legacy:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_CHANNEL: chromium
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  web_e2e_reset:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_CHANNEL: chromium
    defaults:
      run:
        working-directory: web
    steps:
