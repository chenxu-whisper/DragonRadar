name: Data Foundation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_USER: dragon_test
          POSTGRES_PASSWORD: dragon-test-local-only
          POSTGRES_DB: dragon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dragon_test -d dragon_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DRAGON_TEST_DATABASE_URL: postgresql+psycopg://dragon_test:dragon-test-local-only@localhost:5432/dragon_test
      PYTHONPYCACHEPREFIX: ${{ github.workspace }}/.temp/pycache
      UV_CACHE_DIR: ${{ github.workspace }}/.temp/uv-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.8.2
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q -W error --cov=dragon_radar --cov-report=term-missing --cov-report=xml:.temp/coverage.xml
      - run: uv run python -m compileall -q src tests
      - run: uv build --out-dir .temp/dist

  web:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_CHANNEL: chromium
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
