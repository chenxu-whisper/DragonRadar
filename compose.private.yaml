services:
  analysis-worker:
    build: .
    command: ["analysis-worker", "--worker-id", "analysis-worker-1"]
    environment:
      DRAGON_DATABASE_URL: postgresql+psycopg://dragon_radar:${DRAGON_DB_PASSWORD:?Set a strong database password}@db:5432/dragon_radar
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]
    restart: unless-stopped

  api:
    command: ["serve-owner", "--host", "0.0.0.0", "--port", "8000", "--origin", "https://localhost:${DRAGON_PRIVATE_PORT:-8030}"]
    environment:
      DRAGON_OWNER_AUTHORITY: localhost:${DRAGON_PRIVATE_PORT:-8030}
    volumes:
      - ./.temp/private-secrets:/run/dragon-owner
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; request=urllib.request.Request('http://127.0.0.1:8000/health/ready', headers={'Host': os.environ['DRAGON_OWNER_AUTHORITY']}); urllib.request.urlopen(request, timeout=3)"]

  web:
    build:
      context: .
      dockerfile: deploy/private.Dockerfile
    environment:
      DRAGON_OWNER_AUTHORITY: localhost:${DRAGON_PRIVATE_PORT:-8030}
    ports:
      - "127.0.0.1:${DRAGON_PRIVATE_PORT:-8030}:8443"
    volumes:
      - private_caddy_data:/data
      - private_caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    networks: [backend, private_local]
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error --max-time 3 --cacert /data/caddy/pki/authorities/local/root.crt --header \"Host: $$DRAGON_OWNER_AUTHORITY\" https://localhost:8443/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

networks:
  private_local:

volumes:
  private_caddy_data:
  private_caddy_config:
