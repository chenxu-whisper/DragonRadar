﻿[project]
name = "dragon-radar"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
dragon-radar = "dragon_radar:main"

[build-system]
requires = ["uv_build>=0.8.2,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
cache_dir = ".temp/pytest_cache"

[tool.ruff]
cache-dir = ".temp/ruff_cache"

[tool.mypy]
cache_dir = ".temp/mypy_cache"

[tool.coverage.run]
data_file = ".temp/coverage/.coverage"

[tool.coverage.html]
directory = ".temp/coverage/htmlcov"
